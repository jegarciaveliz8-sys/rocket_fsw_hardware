name: Aerospace FSW & GNC Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del Repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias de Simulación
      run: |
        python -m pip install --upgrade pip

    - name: Compilar y Ejecutar Pruebas de Algoritmos GNC (C++)
      run: |
        g++ -std=c++11 -Iinclude src/guidance_test.cpp -o guidance_test
        ./guidance_test

    - name: Ejecutar Simulador Físico (SITL)
      run: |
        python ground_station/sitl_simulator.py

    - name: Ejecutar Analizador de Telemetría Binaria
      run: |
        python ground_station/binary_parser.py

    - name: Ejecutar Simulación Monte Carlo
      run: |
        python ground_station/monte_carlo_sim.py
