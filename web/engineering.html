<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ODYSSEY-1 | Engineering Console</title>
    <style>
        body { font-family: monospace; background: #0b0f19; color: #00ffcc; margin: 0; padding: 20px; }
        .nav-links { margin-bottom: 20px; background: #111827; padding: 10px; border-radius: 6px; }
        .nav-links a { color: #38bdf8; margin-right: 20px; text-decoration: none; font-weight: bold; }
        .nav-links a.active { color: #00ffcc; border-bottom: 2px solid #00ffcc; }
        .card { background: #111827; border: 1px solid #1f2937; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .grid-sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/">🚀 Flight Deck</a>
        <a href="/command">⚠️ Command</a>
        <a href="/engineering" class="active">🛠️ Engineering</a>
        <a href="/orbit">🛰️ Orbit</a>
        <a href="/payload">🔬 Payload</a>
        <a href="/montecarlo">📊 Monte Carlo</a>
        <a href="/replay">📼 Replay Audit</a>
    </div>

    <h1>🛠️ ODYSSEY-1 // Engineering & Substations Console</h1>

    <div class="card">
        <h3 style="color: #00ffcc;">⚡ Estado de Subestaciones & Red de Tierra (Sanarate)</h3>
        <div id="substations-container" class="grid-sub">
            <!-- Carga dinámica -->
        </div>
    </div>

    <script>
    // Mantenemos un registro local del estado actual de cada subestación para alternar correctamente
    const subStates = {};

    function loadSubstations() {
        fetch("/api/substations/status")
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("substations-container");
                container.innerHTML = "";
                
                data.substations.forEach(sub => {
                    // Guardar estado actual si no existe
                    if (subStates[sub.id] === undefined) {
                        subStates[sub.id] = sub.status === "NOMINAL" || sub.status === "ACTIVE";
                    }

                    const isNominal = sub.status === "NOMINAL" || sub.status === "ACTIVE";
                    const color = isNominal ? "#10b981" : (sub.status.includes("CRITICAL") ? "#dc2626" : "#f59e0b");
                    
                    container.innerHTML += `
                        <div style="background: #1f2937; padding: 15px; border-radius: 6px; border-left: 4px solid ${color};">
                            <strong>${sub.name}</strong><br>
                            <span style="font-size: 0.9em; color: #9ca3af;">ID: ${sub.id}</span><br>
                            Voltaje: <span style="color: #38bdf8;">${sub.voltage_kv} kV</span><br>
                            Carga: <span style="color: #38bdf8;">${sub.load_pct}%</span><br>
                            Estado: <span style="color: ${color}; font-weight: bold;">${sub.status}</span><br>
                            <button onclick="toggleSub('${sub.id}')" style="margin-top: 10px; background: #374151; color: #38bdf8; border: 1px solid #4b5563; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-size: 0.8em;">Alternar Estado</button>
                        </div>
                    `;
                });
            })
            .catch(err => console.error("Error al cargar subestaciones:", err));
    }

    function toggleSub(subId) {
        // Alternar el estado booleano local y enviar "enable" o "disable" acorde al backend
        subStates[subId] = !subStates[subId];
        const actionType = subStates[subId] ? "enable" : "disable";

        fetch("/api/substations/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: subId, action: actionType })
        })
        .then(res => res.json())
        .then(data => {
            console.log("Subestación actualizada:", data);
            loadSubstations();
        })
        .catch(err => console.error("Error al alternar subestación:", err));
    }

    loadSubstations();
    setInterval(loadSubstations, 2000);
    </script>
</body>
</html>
